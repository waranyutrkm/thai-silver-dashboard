name: Build & Deploy silver dashboard

on:
  schedule:
    - cron: '*/30 * * * *' # อัปเดตราคาทุก 30 นาที (public repo = Actions ฟรีไม่จำกัด)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # รัน snapshot ใหม่เฉพาะ cron / manual — ส่วน push (Mac cron ส่งข้อมูลมา) ใช้ไฟล์ที่ commit มาแล้ว
      - name: Refresh snapshot (best-effort headless Chromium)
        if: github.event_name != 'push'
        run: |
          npx playwright@1.63.0 install --with-deps chromium || echo "chromium ติดตั้งไม่สำเร็จ — snapshot จะ fallback"
          npm run snapshot || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
